<div class="modal-overlay" *ngIf="isOpen" (click)="onOverlayClick($event)">
  <div class="modal-card">

    <div class="modal-header">
      <span class="modal-logo">
        <mat-icon class="gm-icon-md">sports_esports</mat-icon>
        <strong>GameMetrics</strong> Store
      </span>
      <button class="btn-close" (click)="close()" aria-label="Cerrar">
        <mat-icon class="gm-icon-sm">close</mat-icon>
      </button>
    </div>

    <div class="modal-tabs">
      <button
        class="tab-btn"
        [class.active]="activeTab === 'login'"
        (click)="setTab('login')">
        Iniciar Sesión
      </button>
      <button
        class="tab-btn"
        [class.active]="activeTab === 'register'"
        (click)="setTab('register')">
        Registrarse
      </button>
    </div>

    <form *ngIf="activeTab === 'login'" (ngSubmit)="login()" class="modal-form">
      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          [(ngModel)]="loginEmail"
          name="loginEmail"
          placeholder="tu@email.com"
          autocomplete="email">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <div class="password-field">
          <input
            [type]="showLoginPassword ? 'text' : 'password'"
            [(ngModel)]="loginPassword"
            name="loginPassword"
            placeholder="••••••••"
            autocomplete="current-password">
          <button
            type="button"
            class="toggle-password"
            (click)="showLoginPassword = !showLoginPassword"
            [attr.aria-label]="showLoginPassword ? 'Ocultar contraseña' : 'Ver contraseña'">
            <mat-icon class="gm-icon-sm">{{ showLoginPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
      </div>

      <div class="error-msg" *ngIf="errorMsg">{{ errorMsg }}</div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        <span *ngIf="!loading">Iniciar Sesión</span>
        <span *ngIf="loading" class="spinner-inline"></span>
      </button>

      <p class="forgot-link">¿Olvidaste tu contraseña?</p>
    </form>

    <form *ngIf="activeTab === 'register'" (ngSubmit)="register()" class="modal-form">
      <div class="form-group">
        <label>Nombre de usuario</label>
        <input
          type="text"
          [(ngModel)]="regDisplayName"
          name="regDisplayName"
          placeholder="Tu nombre">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          [(ngModel)]="regEmail"
          name="regEmail"
          placeholder="tu@email.com"
          autocomplete="email">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <div class="password-field">
          <input
            [type]="showRegPassword ? 'text' : 'password'"
            [(ngModel)]="regPassword"
            name="regPassword"
            placeholder="Mínimo 8 caracteres"
            autocomplete="new-password">
          <button
            type="button"
            class="toggle-password"
            (click)="showRegPassword = !showRegPassword"
            [attr.aria-label]="showRegPassword ? 'Ocultar contraseña' : 'Ver contraseña'">
            <mat-icon class="gm-icon-sm">{{ showRegPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label>Confirmar contraseña</label>
        <div class="password-field">
          <input
            [type]="showRegPasswordConfirm ? 'text' : 'password'"
            [(ngModel)]="regPasswordConfirm"
            name="regPasswordConfirm"
            placeholder="Repite tu contraseña"
            autocomplete="new-password">
          <button
            type="button"
            class="toggle-password"
            (click)="showRegPasswordConfirm = !showRegPasswordConfirm"
            [attr.aria-label]="showRegPasswordConfirm ? 'Ocultar contraseña' : 'Ver contraseña'">
            <mat-icon class="gm-icon-sm">{{ showRegPasswordConfirm ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label>País de residencia</label>
        <select
          [(ngModel)]="regCountry"
          name="regCountry"
          class="country-select"
          required>
          <option value="" disabled>Selecciona tu país</option>
          <option *ngFor="let c of countries" [value]="c.country_code">
            {{ c.flag }} {{ c.name }}
          </option>
        </select>
        <p class="field-hint">
          Define precios e impuestos de tu cuenta. No se podrá cambiar después (como en Steam).
        </p>
      </div>

      <div class="error-msg" *ngIf="errorMsg">{{ errorMsg }}</div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        <span *ngIf="!loading">Crear cuenta</span>
        <span *ngIf="loading" class="spinner-inline"></span>
      </button>
    </form>

  </div>
</div>
