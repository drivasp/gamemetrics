@if (displaySrc) {
  <img
    [src]="displaySrc"
    [alt]="alt"
    [class]="'gm-cover-img ' + imgClass"
    (error)="onImageError()"
    loading="lazy" />
} @else {
  <div class="gm-cover-fallback" [class]="'size-' + size">
    <span class="gm-cover-title">{{ title || alt || 'Juego' }}</span>
  </div>
}
